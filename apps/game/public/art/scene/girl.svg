<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 88" width="320" height="440">
  <!-- The child's walking avatar in Le jardin de Lila: original app drawing (a drawn character, never a photo). -->
  <defs>
    <linearGradient id="dress" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff86b6"/>
      <stop offset="1" stop-color="#ec5c96"/>
    </linearGradient>
    <radialGradient id="face" cx=".45" cy=".4" r=".7">
      <stop offset="0" stop-color="#ffe2c6"/>
      <stop offset="1" stop-color="#f3c69d"/>
    </radialGradient>
  </defs>
  <!-- legs and shoes -->
  <rect x="24" y="70" width="6" height="11" rx="3" fill="#f3c69d"/>
  <rect x="34" y="70" width="6" height="11" rx="3" fill="#f3c69d"/>
  <ellipse cx="26.5" cy="83" rx="5.5" ry="3.6" fill="#6a4fc4"/>
  <ellipse cx="37.5" cy="83" rx="5.5" ry="3.6" fill="#6a4fc4"/>
  <!-- arms -->
  <ellipse cx="15" cy="60" rx="4.2" ry="8" fill="#f3c69d" transform="rotate(16 15 60)"/>
  <ellipse cx="49" cy="60" rx="4.2" ry="8" fill="#f3c69d" transform="rotate(-16 49 60)"/>
  <!-- dress -->
  <path d="M22 48h20l9 25q-19 6-38 0z" fill="url(#dress)" stroke="#c9437c" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M25 48q7 6 14 0" fill="#fff" stroke="#f1d2e0" stroke-width="1"/>
  <g fill="#fff" opacity=".85"><circle cx="26" cy="60" r="1.6"/><circle cx="36" cy="57" r="1.6"/><circle cx="31" cy="66" r="1.6"/><circle cx="41" cy="66" r="1.6"/><circle cx="21" cy="69" r="1.4"/></g>
  <!-- pigtails -->
  <circle cx="11" cy="31" r="7.5" fill="#7a4428"/>
  <circle cx="53" cy="31" r="7.5" fill="#7a4428"/>
  <path d="M9 21l5 4-5 4z M19 21l-5 4 5 4z" fill="#ffd34d"/>
  <path d="M45 21l5 4-5 4z M55 21l-5 4 5 4z" fill="#ffd34d"/>
  <!-- head -->
  <circle cx="32" cy="30" r="19" fill="url(#face)" stroke="#d9a578" stroke-width="1.2"/>
  <path d="M13 30q0-20 19-20t19 20q-6-9-14-10-3 6-11 6-8 0-13 4z" fill="#8a4f2e" stroke="#6b3a20" stroke-width="1.2"/>
  <!-- face -->
  <ellipse cx="25" cy="32" rx="2.6" ry="3.3" fill="#2b2b3a"/>
  <ellipse cx="39" cy="32" rx="2.6" ry="3.3" fill="#2b2b3a"/>
  <circle cx="26" cy="30.8" r="1" fill="#fff"/>
  <circle cx="40" cy="30.8" r="1" fill="#fff"/>
  <ellipse cx="21" cy="38" rx="3.4" ry="2.2" fill="#ff8fa8" opacity=".55"/>
  <ellipse cx="43" cy="38" rx="3.4" ry="2.2" fill="#ff8fa8" opacity=".55"/>
  <path d="M28 39q4 4 8 0" fill="none" stroke="#a5503c" stroke-width="1.8" stroke-linecap="round"/>
</svg>
