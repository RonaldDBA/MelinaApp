<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="1536" height="1024">
  <!-- Le potager: original app drawing (raised wooden bed with three soil rows, no plants; used until the parents
       approve a photo). The rows sit where GardenScene.ts plants the pousses and tournesols. -->
  <defs>
    <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a4f2f"/>
      <stop offset="1" stop-color="#5e3a22"/>
    </linearGradient>
    <linearGradient id="row" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a6a43"/>
      <stop offset="1" stop-color="#7a5032"/>
    </linearGradient>
    <linearGradient id="plank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2a867"/>
      <stop offset="1" stop-color="#c88a4c"/>
    </linearGradient>
  </defs>
  <ellipse cx="152" cy="160" rx="130" ry="12" fill="#1f4d24" opacity=".25"/>
  <!-- front face of the frame -->
  <rect x="30" y="58" width="240" height="98" rx="12" fill="#a8703c"/>
  <!-- top of the frame -->
  <rect x="30" y="48" width="240" height="96" rx="12" fill="url(#plank)" stroke="#9a6234" stroke-width="3"/>
  <rect x="44" y="60" width="212" height="74" rx="7" fill="url(#soil)"/>
  <!-- rows -->
  <g>
    <rect x="52" y="68" width="196" height="14" rx="7" fill="url(#row)"/>
    <rect x="52" y="93" width="196" height="14" rx="7" fill="url(#row)"/>
    <rect x="52" y="118" width="196" height="12" rx="6" fill="url(#row)"/>
    <g fill="#b98458" opacity=".7"><ellipse cx="80" cy="71" rx="10" ry="2"/><ellipse cx="170" cy="96" rx="12" ry="2"/><ellipse cx="120" cy="120" rx="10" ry="2"/><ellipse cx="220" cy="71" rx="8" ry="2"/></g>
  </g>
  <!-- plank seams and corner posts -->
  <g stroke="#b77a3e" stroke-width="2" opacity=".8"><path d="M100 50v9M200 50v9M100 135v8M200 135v8"/></g>
  <g fill="#f0c088" stroke="#9a6234" stroke-width="2">
    <rect x="26" y="44" width="18" height="18" rx="5"/><rect x="256" y="44" width="18" height="18" rx="5"/>
    <rect x="26" y="130" width="18" height="18" rx="5"/><rect x="256" y="130" width="18" height="18" rx="5"/>
  </g>
  <path d="M42 146h216" stroke="#8c5a2c" stroke-width="2" opacity=".5"/>
</svg>
