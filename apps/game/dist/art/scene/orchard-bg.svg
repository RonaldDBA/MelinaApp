  <rect width="1920" height="1080" fill="url(#sky)"/>
  <circle cx="1650" cy="210" r="330" fill="url(#glow)"/>
  <circle cx="1650" cy="210" r="78" fill="url(#sun)"/>

  <use xlink:href="#cloud" transform="translate(330 190) scale(.9)" opacity=".95"/>
  <use xlink:href="#cloud" transform="translate(1010 150) scale(.62)" opacity=".85"/>
  <use xlink:href="#cloud" transform="translate(1330 290) scale(.5)" opacity=".8"/>

  <path d="M0 470 L0 392 Q150 300 320 372 Q470 292 640 360 Q810 270 990 352 Q1150 284 1320 344 Q1500 262 1690 350 Q1820 310 1920 372 L1920 470 Z" fill="url(#far)"/>
  <path d="M0 500 Q260 372 640 430 T1300 410 T1920 392 L1920 620 L0 620 Z" fill="url(#h1)"/>

  <g>
    <use xlink:href="#tree" transform="translate(120 388) scale(.42)"/><use xlink:href="#tree" transform="translate(215 372) scale(.42)"/>
    <use xlink:href="#tree" transform="translate(310 362) scale(.42)"/><use xlink:href="#tree" transform="translate(405 357) scale(.42)"/>
    <use xlink:href="#tree" transform="translate(500 356) scale(.42)"/><use xlink:href="#tree" transform="translate(595 360) scale(.42)"/>
    <use xlink:href="#tree" transform="translate(1010 372) scale(.42)"/><use xlink:href="#tree" transform="translate(1105 366) scale(.42)"/>
    <use xlink:href="#tree" transform="translate(1200 362) scale(.42)"/>
  </g>

  <!-- barn -->
  <g transform="translate(1410 262)">
    <ellipse cx="110" cy="170" rx="150" ry="14" fill="#1e5a2a" opacity=".2"/>
    <path d="M0 70 L110 0 L220 70 L220 168 L0 168 Z" fill="#e2564f"/>
    <path d="M110 0 L220 70 L220 168 L110 168 Z" fill="#c9443f"/>
    <path d="M-16 76 L110 -8 L236 76 L222 84 L110 10 L-2 84 Z" fill="#7d2f33"/>
    <rect x="78" y="96" width="64" height="72" rx="4" fill="#8d3035"/>
    <path d="M78 96 L142 168 M142 96 L78 168" stroke="#f7e9d0" stroke-width="6"/>
    <rect x="78" y="96" width="64" height="72" rx="4" fill="none" stroke="#f7e9d0" stroke-width="6"/>
    <circle cx="110" cy="52" r="15" fill="#f7e9d0"/>
    <rect x="232" y="40" width="54" height="128" rx="26" fill="#d7dee6"/>
    <path d="M232 62 Q259 22 286 62 Z" fill="#9aa7b5"/>
  </g>

  <path d="M0 568 Q380 452 860 520 T1920 478 L1920 760 L0 760 Z" fill="url(#h2)"/>
  <g>
    <use xlink:href="#tree" transform="translate(70 470) scale(.74)"/><use xlink:href="#tree" transform="translate(250 446) scale(.74)"/>
    <use xlink:href="#tree" transform="translate(430 432) scale(.74)"/><use xlink:href="#tree" transform="translate(610 430) scale(.74)"/>
    <use xlink:href="#tree" transform="translate(790 438) scale(.74)"/><use xlink:href="#tree" transform="translate(1180 452) scale(.74)"/>
    <use xlink:href="#tree" transform="translate(1790 418) scale(.74)"/>
  </g>

  <!-- path to the barn -->
  <path d="M1490 432 Q1420 520 1180 600 Q960 670 900 1080 L1150 1080 Q1170 720 1330 620 Q1500 520 1540 432 Z" fill="url(#path)" opacity=".92"/>

  <path d="M0 640 Q460 560 980 610 T1920 580 L1920 1080 L0 1080 Z" fill="url(#ground)"/>
  <path d="M0 640 Q460 560 980 610 T1920 580" stroke="#9be07f" stroke-width="7" fill="none" opacity=".7"/>

  <!-- fence -->
  <g stroke="#f6ecd4" stroke-linecap="round">
    <path d="M1560 596 L1920 574" stroke-width="9"/><path d="M1560 622 L1920 600" stroke-width="9"/>
    <path d="M1580 578 L1580 640 M1660 573 L1660 636 M1740 568 L1740 632 M1820 563 L1820 628 M1900 558 L1900 624" stroke-width="13"/>
  </g>

  <g opacity=".85">
    <use xlink:href="#tuft" transform="translate(60 720)"/><use xlink:href="#tuft" transform="translate(960 700) scale(.9)"/>
    <use xlink:href="#tuft" transform="translate(1880 760)"/><use xlink:href="#tuft" transform="translate(30 1010) scale(1.3)"/>
    <use xlink:href="#tuft" transform="translate(1890 1030) scale(1.3)"/><use xlink:href="#tuft" transform="translate(955 930)"/>
    <use xlink:href="#tuft" transform="translate(1500 1050) scale(1.1)"/>
  </g>
  <use xlink:href="#flower" transform="translate(40 860)" fill="#fff"/><use xlink:href="#flower" transform="translate(965 820) scale(.9)" fill="#ffd1e6"/>
  <use xlink:href="#flower" transform="translate(1890 900)" fill="#fff"/><use xlink:href="#flower" transform="translate(1870 690) scale(.8)" fill="#ffe08a"/>
  <use xlink:href="#flower" transform="translate(945 1050) scale(1.1)" fill="#fff"/>
