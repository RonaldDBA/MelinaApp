<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fa9f5"/>
      <stop offset=".6" stop-color="#9bd8ff"/>
      <stop offset="1" stop-color="#e9f8ff"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff7c9" stop-opacity=".95"/>
      <stop offset=".35" stop-color="#ffe98a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ffe98a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun" cx=".4" cy=".35" r=".7">
      <stop offset="0" stop-color="#fffbe0"/>
      <stop offset="1" stop-color="#ffcf48"/>
    </radialGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fc3e6"/>
      <stop offset="1" stop-color="#c4e6f2"/>
    </linearGradient>
    <linearGradient id="h1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9e08f"/>
      <stop offset="1" stop-color="#8fd47c"/>
    </linearGradient>
    <linearGradient id="h2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#84d070"/>
      <stop offset="1" stop-color="#6cc260"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#74cb62"/>
      <stop offset=".45" stop-color="#57b653"/>
      <stop offset="1" stop-color="#37923f"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3e3b3"/>
      <stop offset="1" stop-color="#e2c98a"/>
    </linearGradient>
    <g id="tree">
      <ellipse cx="0" cy="120" rx="56" ry="11" fill="#1e5a2a" opacity=".22"/>
      <path d="M-9 44 Q-12 90 -14 120 L14 120 Q11 90 9 44 Z" fill="#8b5a36"/>
      <path d="M2 60 Q22 52 30 34" stroke="#8b5a36" stroke-width="7" fill="none" stroke-linecap="round"/>
      <circle cx="-42" cy="28" r="40" fill="#2f8f45"/>
      <circle cx="44" cy="26" r="42" fill="#2f8f45"/>
      <circle cx="0" cy="0" r="62" fill="#3aa450"/>
      <circle cx="-20" cy="-22" r="34" fill="#5dc063" opacity=".85"/>
      <circle cx="30" cy="2" r="22" fill="#4bb35a" opacity=".8"/>
      <g fill="#f0473e">
        <circle cx="-34" cy="14" r="7.5"/><circle cx="16" cy="-12" r="7.5"/><circle cx="46" cy="32" r="7.5"/>
        <circle cx="-6" cy="38" r="7.5"/><circle cx="-56" cy="40" r="7.5"/><circle cx="22" cy="30" r="7.5"/>
      </g>
      <g fill="#fff" opacity=".55">
        <circle cx="-36" cy="12" r="2.2"/><circle cx="14" cy="-14" r="2.2"/><circle cx="44" cy="30" r="2.2"/><circle cx="-8" cy="36" r="2.2"/>
      </g>
    </g>
    <g id="cloud">
      <ellipse cx="0" cy="0" rx="120" ry="34" fill="#fff"/>
      <circle cx="-52" cy="-18" r="40" fill="#fff"/><circle cx="6" cy="-38" r="54" fill="#fff"/><circle cx="64" cy="-14" r="36" fill="#fff"/>
      <ellipse cx="6" cy="16" rx="104" ry="14" fill="#dbeeff" opacity=".9"/>
    </g>
    <g id="tuft" fill="none" stroke="#2f8a3b" stroke-width="5" stroke-linecap="round">
      <path d="M0 0 Q-4 -18 -14 -26"/><path d="M4 0 Q4 -22 2 -34"/><path d="M8 0 Q14 -16 22 -22"/>
    </g>
    <g id="flower">
      <path d="M0 0 Q2 -14 0 -26" stroke="#2f8a3b" stroke-width="4" fill="none" stroke-linecap="round"/>
      <g transform="translate(0 -30)">
        <circle cx="0" cy="-8" r="6.5"/><circle cx="8" cy="-2" r="6.5"/><circle cx="5" cy="7" r="6.5"/><circle cx="-5" cy="7" r="6.5"/><circle cx="-8" cy="-2" r="6.5"/>
        <circle cx="0" cy="0" r="5" fill="#ffd54a"/>
      </g>
    </g>
